<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Activity — RMP Tracker</title>
<script src="db.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #0369a1;
  --accent:  #6366f1;
  --green:   #16a34a;
  --red:     #dc2626;
  --border:  #e2e8f0;
  --muted:   #64748b;
  --radius:  12px;
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; min-height: 100vh; }

/* Header */
.header {
  background: linear-gradient(135deg, #0f172a, #0369a1);
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
}
.header-brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 900; font-size: 1rem; }
.header-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
.btn-nav { color: rgba(255,255,255,.75); font-size: .8rem; font-weight: 600; text-decoration: none; }
.btn-nav:hover { color: #fff; }

/* PIN overlay */
#pin-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #0f172a, #0369a1);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
#pin-overlay.hidden { display: none; }
.pin-card {
  background: #fff; border-radius: 20px; padding: 36px 28px;
  width: 100%; max-width: 340px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.pin-logo { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg,#0369a1,#6366f1); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
.pin-title { font-size: 1.1rem; font-weight: 800; color: #0f172a; }
.pin-sub { font-size: .82rem; color: var(--muted); text-align: center; }
.pin-card input { width: 100%; height: 42px; padding: 0 14px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 14px; font-family: inherit; letter-spacing: 3px; text-align: center; }
.pin-card input:focus { outline: none; border-color: var(--primary); }
.pin-btn { width: 100%; height: 44px; background: linear-gradient(135deg,#0369a1,#6366f1); color: #fff; border: none; border-radius: 9px; font-size: .95rem; font-weight: 800; cursor: pointer; font-family: inherit; transition: opacity .2s; }
.pin-btn:hover:not(:disabled) { opacity: .9; }
.pin-btn:disabled { opacity: .6; cursor: default; }
#pin-err { font-size: .78rem; color: var(--red); min-height: 16px; text-align: center; }

/* Page */
.page { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }

.form-card {
  background: #fff; border-radius: var(--radius);
  box-shadow: 0 2px 16px rgba(0,0,0,.08);
  padding: 28px 28px;
}
.form-card h2 { font-size: 1rem; font-weight: 800; color: #0f172a; margin-bottom: 22px; }

.section-title {
  font-size: .68rem; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em;
  margin: 20px 0 10px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.section-title:first-of-type { margin-top: 0; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1 / -1; }

label { font-size: .78rem; font-weight: 700; color: #374151; }
label span.req { color: var(--red); margin-left: 2px; }

select, input[type=text], input[type=tel], textarea {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .88rem; font-family: inherit; color: #1a1a2e;
  background: #fff; outline: none;
  transition: border-color .15s;
}
select:focus, input:focus, textarea:focus { border-color: var(--primary); }
select:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }
textarea { resize: vertical; min-height: 70px; }

.btn-submit {
  width: 100%; margin-top: 24px; padding: 14px;
  background: linear-gradient(135deg, #0369a1, #6366f1);
  color: #fff; border: none; border-radius: 10px;
  font-size: 1rem; font-weight: 800; cursor: pointer;
  font-family: inherit; transition: opacity .2s;
}
.btn-submit:hover:not(:disabled) { opacity: .9; }
.btn-submit:disabled { opacity: .55; cursor: not-allowed; }

/* Success state */
#success-screen { display: none; text-align: center; padding: 48px 20px; }
.success-icon { font-size: 3.5rem; margin-bottom: 16px; }
#success-screen h2 { font-size: 1.2rem; font-weight: 800; color: var(--green); margin-bottom: 8px; }
#success-screen p { color: var(--muted); font-size: .88rem; margin-bottom: 24px; }
.btn-again {
  padding: 12px 28px; background: var(--green); color: #fff;
  border: none; border-radius: 9px; font-size: .9rem; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: opacity .2s; margin: 0 6px;
}
.btn-again:hover { opacity: .85; }
.btn-dash {
  padding: 12px 28px; background: transparent; color: var(--primary);
  border: 2px solid var(--primary); border-radius: 9px; font-size: .9rem; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all .2s; margin: 0 6px;
  text-decoration: none; display: inline-block;
}
.btn-dash:hover { background: var(--primary); color: #fff; }

/* Geo status */
.geo-bar {
  display: flex; align-items: center; gap: 10px;
  background: #f8fafc; border: 1.5px solid var(--border);
  border-radius: 9px; padding: 10px 14px; margin-top: 10px;
}
.geo-bar.geo-ok   { background: #f0fdf4; border-color: #86efac; }
.geo-bar.geo-err  { background: #fff5f5; border-color: #fca5a5; }
.geo-bar.geo-load { background: #eff6ff; border-color: #bfdbfe; }
.geo-icon { font-size: 1.1rem; flex-shrink: 0; }
.geo-text { font-size: .78rem; font-weight: 600; flex: 1; color: #374151; }
.geo-text small { font-weight: 400; color: var(--muted); display: block; margin-top: 1px; }
.btn-geo {
  padding: 5px 12px; border-radius: 6px; border: 1.5px solid var(--border);
  background: #fff; font-size: .74rem; font-weight: 700; color: var(--primary);
  cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0;
  transition: all .15s;
}
.btn-geo:hover { background: #eff6ff; }

@media (max-width: 520px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-card { padding: 20px 16px; }
}
</style>
</head>
<body>

<!-- PIN OVERLAY -->
<div id="pin-overlay">
  <div class="pin-card">
    <div class="pin-logo">📍</div>
    <div class="pin-title">RMP Tracker</div>
    <div class="pin-sub">Masukkan PIN untuk mengakses form input activity</div>
    <input type="password" id="pin-input" inputmode="numeric" maxlength="8"
           placeholder="Masukkan PIN"
           onkeydown="if(event.key==='Enter') doLogin()">
    <button class="pin-btn" onclick="doLogin()">Masuk</button>
    <div id="pin-err"></div>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-brand">
    <div class="header-icon">📍</div>
    RMP Tracker
  </div>
  <div style="display:flex;align-items:center;gap:14px">
    <button onclick="doLogout()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;font-size:.75rem;cursor:pointer;font-family:inherit">Keluar</button>
    <a href="index.html" class="btn-nav">&#8592; Beranda</a>
  </div>
</div>

<div class="page">

  <!-- FORM -->
  <div class="form-card" id="form-section">
    <h2>📝 Input Activity Leads</h2>

    <div class="section-title">Informasi Tim</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="fCity">City <span class="req">*</span></label>
        <select id="fCity" onchange="onCityChange()">
          <option value="">Pilih City…</option>
        </select>
      </div>
      <div class="form-group">
        <label for="fTSC">TSC <span class="req">*</span></label>
        <select id="fTSC" onchange="onTSCChange()" disabled>
          <option value="">Pilih TSC…</option>
        </select>
      </div>
      <div class="form-group">
        <label for="fSPV">SPV <span class="req">*</span></label>
        <select id="fSPV" onchange="onSPVChange()" disabled>
          <option value="">Pilih SPV…</option>
        </select>
      </div>
      <div class="form-group">
        <label for="fAE">AE <span class="req">*</span></label>
        <select id="fAE" disabled>
          <option value="">Pilih AE…</option>
        </select>
      </div>
    </div>

    <div class="section-title">Data Leads</div>
    <div class="form-grid">
      <div class="form-group full">
        <label for="fNama">Nama Leads <span class="req">*</span></label>
        <input type="text" id="fNama" placeholder="Nama lengkap leads">
      </div>
      <div class="form-group full">
        <label for="fAlamat">Alamat Leads</label>
        <textarea id="fAlamat" placeholder="Alamat lengkap leads"></textarea>
      </div>
      <div class="form-group">
        <label for="fTelp">No. Telepon</label>
        <input type="tel" id="fTelp" placeholder="08xxxxxxxxxx">
      </div>
    </div>

    <div class="section-title">Profil ISP & Kebutuhan</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="fISP">Current ISP <span class="req">*</span></label>
        <select id="fISP">
          <option value="">Pilih ISP…</option>
          <option>Tidak Ada ISP</option>
          <option>IndiHome / Telkom</option>
          <option>Biznet</option>
          <option>MyRepublic</option>
          <option>First Media</option>
          <option>MNC Play</option>
          <option>CBN</option>
          <option>Iconnet</option>
          <option>XL Home</option>
          <option>Lainnya</option>
        </select>
      </div>
      <div class="form-group">
        <label for="fContract">Contract Period <span class="req">*</span></label>
        <select id="fContract">
          <option value="">Pilih periode…</option>
          <option>Tidak Ada Kontrak</option>
          <option>&lt; 6 Bulan</option>
          <option>6 - 12 Bulan</option>
          <option>1 - 2 Tahun</option>
          <option>&gt; 2 Tahun</option>
        </select>
      </div>
      <div class="form-group">
        <label for="fFamily">Family Needs <span class="req">*</span></label>
        <select id="fFamily">
          <option value="">Pilih jumlah…</option>
          <option>1 Orang</option>
          <option>2 - 3 Orang</option>
          <option>4 - 5 Orang</option>
          <option>&gt; 5 Orang</option>
        </select>
      </div>
      <div class="form-group">
        <label for="fBudget">Budget / Bulan <span class="req">*</span></label>
        <select id="fBudget">
          <option value="">Pilih budget…</option>
          <option>&lt; Rp 200.000</option>
          <option>Rp 200.000 - 300.000</option>
          <option>Rp 300.001 - 500.000</option>
          <option>Rp 500.001 - 700.000</option>
          <option>&gt; Rp 700.000</option>
        </select>
      </div>
    </div>

    <div class="section-title">Lokasi</div>
    <div class="geo-bar geo-load" id="geo-bar">
      <span class="geo-icon">⏳</span>
      <div class="geo-text">Menunggu lokasi…<small>Izinkan akses lokasi di browser</small></div>
      <button class="btn-geo" onclick="captureLocation()">📍 Ambil Lokasi</button>
    </div>

    <button class="btn-submit" id="btn-submit" onclick="submitForm()">Simpan Activity</button>
  </div>

  <!-- SUCCESS -->
  <div class="form-card" id="success-screen">
    <div class="success-icon">✅</div>
    <h2>Activity Tersimpan!</h2>
    <p id="success-msg">Data leads berhasil disimpan.</p>
    <div>
      <button class="btn-again" onclick="resetForm()">+ Input Lagi</button>
      <a href="dashboard.html" class="btn-dash">Lihat Dashboard</a>
    </div>
  </div>

</div>

<script>
const SK_PIN = 'rmp_pin';
let aeList   = [];
let geoData  = { lat: '', lng: '', accuracy: '' };

// ── Auth ──────────────────────────────────────────────────────────
async function doLogin() {
  const pin = document.getElementById('pin-input').value.trim();
  const err = document.getElementById('pin-err');
  const btn = document.querySelector('.pin-btn');
  err.textContent = '';
  if (!pin) { err.textContent = 'Masukkan PIN terlebih dahulu.'; return; }

  btn.disabled = true; btn.textContent = '⏳ Memverifikasi…';
  const ok = await DB_RMP.verifyPin(pin);
  btn.disabled = false; btn.textContent = 'Masuk';

  if (ok) {
    sessionStorage.setItem(SK_PIN, pin);
    DB_RMP.setPin(pin);
    document.getElementById('pin-overlay').classList.add('hidden');
    loadConfig();
  } else {
    err.textContent = 'PIN salah. Coba lagi.';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').focus();
  }
}

function doLogout() {
  sessionStorage.removeItem(SK_PIN);
  location.reload();
}

async function init() {
  const saved = sessionStorage.getItem(SK_PIN);
  if (saved) {
    const ok = await DB_RMP.verifyPin(saved);
    if (ok) {
      DB_RMP.setPin(saved);
      document.getElementById('pin-overlay').classList.add('hidden');
      loadConfig();
      return;
    }
    sessionStorage.removeItem(SK_PIN);
  }
}

// ── Load AE config ────────────────────────────────────────────────
async function loadConfig() {
  showLoading(true);
  const list = await DB_RMP.getConfig();
  showLoading(false);
  if (!list) { showToast('Gagal memuat data tim. Cek koneksi.', 'error'); return; }
  aeList = list;

  const cities = [...new Set(list.map(r => r.city).filter(Boolean))].sort();
  fillSelect('fCity', cities, 'Pilih City…');
  captureLocation();
}

// ── Geolocation ───────────────────────────────────────────────────
function captureLocation() {
  const bar = document.getElementById('geo-bar');
  if (!navigator.geolocation) {
    bar.className = 'geo-bar geo-err';
    bar.querySelector('.geo-icon').textContent = '❌';
    bar.querySelector('.geo-text').innerHTML = 'GPS tidak didukung browser ini<small>Lokasi tidak akan direkam</small>';
    return;
  }
  bar.className = 'geo-bar geo-load';
  bar.querySelector('.geo-icon').textContent = '⏳';
  bar.querySelector('.geo-text').innerHTML = 'Mengambil lokasi…<small>Mohon tunggu sebentar</small>';

  navigator.geolocation.getCurrentPosition(
    pos => {
      geoData = {
        lat:      pos.coords.latitude.toFixed(6),
        lng:      pos.coords.longitude.toFixed(6),
        accuracy: Math.round(pos.coords.accuracy),
      };
      const mapsUrl = `https://maps.google.com/?q=${geoData.lat},${geoData.lng}`;
      bar.className = 'geo-bar geo-ok';
      bar.querySelector('.geo-icon').textContent = '✅';
      bar.querySelector('.geo-text').innerHTML =
        `±${geoData.accuracy}m &nbsp;·&nbsp; ${geoData.lat}, ${geoData.lng}<small><a href="${mapsUrl}" target="_blank" style="color:var(--primary)">Lihat di Maps</a></small>`;
    },
    err => {
      geoData = { lat: '', lng: '', accuracy: '' };
      const msgs = { 1: 'Akses lokasi ditolak — izinkan di browser', 2: 'Lokasi tidak tersedia', 3: 'Timeout, coba lagi' };
      bar.className = 'geo-bar geo-err';
      bar.querySelector('.geo-icon').textContent = '⚠️';
      bar.querySelector('.geo-text').innerHTML = (msgs[err.code] || 'Gagal mengambil lokasi') + '<small>Klik "Ambil Lokasi" untuk coba lagi</small>';
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
}

// ── Cascading dropdowns ───────────────────────────────────────────
function fillSelect(id, options, placeholder) {
  const el = document.getElementById(id);
  el.innerHTML = `<option value="">${placeholder}</option>`;
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = opt.textContent = o;
    el.appendChild(opt);
  });
  el.disabled = options.length === 0;
}

function onCityChange() {
  const city = document.getElementById('fCity').value;
  const tscs = [...new Set(aeList.filter(r => r.city === city).map(r => r.tsc).filter(Boolean))].sort();
  fillSelect('fTSC', tscs, 'Pilih TSC…');
  fillSelect('fSPV', [], 'Pilih SPV…');
  fillSelect('fAE',  [], 'Pilih AE…');
  document.getElementById('fSPV').disabled = true;
  document.getElementById('fAE').disabled  = true;
}

function onTSCChange() {
  const city = document.getElementById('fCity').value;
  const tsc  = document.getElementById('fTSC').value;
  const spvs = [...new Set(aeList.filter(r => r.city === city && r.tsc === tsc).map(r => r.spv).filter(Boolean))].sort();
  fillSelect('fSPV', spvs, 'Pilih SPV…');
  fillSelect('fAE',  [], 'Pilih AE…');
  document.getElementById('fAE').disabled = true;
}

function onSPVChange() {
  const city = document.getElementById('fCity').value;
  const tsc  = document.getElementById('fTSC').value;
  const spv  = document.getElementById('fSPV').value;
  const aes  = [...new Set(aeList.filter(r => r.city === city && r.tsc === tsc && r.spv === spv).map(r => r.ae).filter(Boolean))].sort();
  fillSelect('fAE', aes, 'Pilih AE…');
}

// ── Submit ────────────────────────────────────────────────────────
async function submitForm() {
  const city    = document.getElementById('fCity').value;
  const tsc     = document.getElementById('fTSC').value;
  const spv     = document.getElementById('fSPV').value;
  const ae      = document.getElementById('fAE').value;
  const nama    = document.getElementById('fNama').value.trim();
  const isp     = document.getElementById('fISP').value;
  const contract= document.getElementById('fContract').value;
  const family  = document.getElementById('fFamily').value;
  const budget  = document.getElementById('fBudget').value;

  const required = [
    [city,     'City'],
    [tsc,      'TSC'],
    [spv,      'SPV'],
    [ae,       'AE'],
    [nama,     'Nama Leads'],
    [isp,      'Current ISP'],
    [contract, 'Contract Period'],
    [family,   'Family Needs'],
    [budget,   'Budget'],
  ];
  for (const [v, label] of required) {
    if (!v) { showToast(`${label} wajib diisi.`, 'error'); return; }
  }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = '⏳ Menyimpan…';

  const data = {
    city, tsc, spv, ae, namaLeads: nama,
    alamat:         document.getElementById('fAlamat').value.trim(),
    noTelp:         document.getElementById('fTelp').value.trim(),
    currentISP:     isp,
    contractPeriod: contract,
    familyNeeds:    family,
    budget,
    lat:            geoData.lat,
    lng:            geoData.lng,
    accuracy:       geoData.accuracy,
  };

  const res = await DB_RMP.submitActivity(data);
  btn.disabled = false; btn.textContent = 'Simpan Activity';

  if (res && res.ok) {
    document.getElementById('success-msg').textContent =
      `Activity untuk "${nama}" (${ae}) berhasil disimpan. ID: ${res.id}`;
    document.getElementById('form-section').style.display   = 'none';
    document.getElementById('success-screen').style.display = 'block';
  } else {
    showToast('Gagal menyimpan: ' + (res?.error || 'Unknown error'), 'error');
  }
}

function resetForm() {
  document.getElementById('form-section').style.display   = '';
  document.getElementById('success-screen').style.display = 'none';
  ['fCity','fTSC','fSPV','fAE','fISP','fContract','fFamily','fBudget'].forEach(id => {
    document.getElementById(id).value = '';
  });
  ['fNama','fAlamat','fTelp'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('fTSC').disabled = true;
  document.getElementById('fSPV').disabled = true;
  document.getElementById('fAE').disabled  = true;
  onCityChange();
  captureLocation();
}

init();
</script>
</body>
</html>
