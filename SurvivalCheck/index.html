<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival Mode — Update</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; background: #eef2f7; min-height: 100vh; }

/* HEADER */
#hdr {
  background: #1e2a3a; color: white;
  padding: 10px 16px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
#hdr h1 { font-size: 15px; font-weight: 700; color: #7dd3fc; white-space: nowrap; }
.tb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; }
.tb input, .tb select {
  height: 28px; padding: 0 8px;
  border: 1px solid #334155; border-radius: 5px;
  font-size: 12px; background: #0f172a; color: #e2e8f0;
}
.tb input:focus, .tb select:focus { outline: 1px solid #7dd3fc; }
#q { width: 200px; }
#fSpv { min-width: 170px; }
#fM2, #fM3 { min-width: 120px; }
#inf { color: #94a3b8; font-size: 11px; white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 28px; padding: 0 10px; border: none; border-radius: 5px;
  font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn-blue  { background: #3b82f6; color: white; }
.btn-blue:hover { background: #2563eb; }
.btn-green { background: #22c55e; color: white; }
.btn-green:hover { background: #16a34a; }
.btn-slate { background: #475569; color: white; }
.btn-slate:hover { background: #334155; }

/* DIRTY BAR */
#dbar {
  display: none; align-items: center; gap: 10px;
  padding: 8px 16px; background: #fefce8;
  border-bottom: 2px solid #fde047;
  font-size: 12px; color: #713f12;
}
#dbar.show { display: flex; }

/* TABLE */
.tw {
  margin: 12px; background: white;
  border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.1);
  overflow-x: auto;
}
table { border-collapse: collapse; width: 100%; min-width: 1180px; }

thead th {
  background: #1e2a3a; color: #cbd5e1;
  padding: 9px 8px; text-align: left;
  font-size: 11px; font-weight: 600;
  white-space: nowrap; text-transform: uppercase; letter-spacing: .4px;
  position: sticky; top: 48px; z-index: 50;
  border-right: 1px solid #273447;
}
thead th:last-child { border-right: none; }

tbody tr { border-bottom: 1px solid #f1f5f9; }
tbody tr:hover  { background: #f8fafc; }
tbody tr.dirty  { background: #fefce8 !important; }
tbody tr.saving { background: #eff6ff !important; opacity: .75; pointer-events: none; }
tbody tr.saved  { background: #f0fdf4 !important; }
tbody tr.errrow { background: #fef2f2 !important; }

td { padding: 4px 8px; vertical-align: middle; }
.tacc { font-family: 'Courier New', monospace; font-size: 12px; font-weight: 700; color: #1e2a3a; white-space: nowrap; }
.tro  { color: #475569; font-size: 12px; }
.tspv { font-weight: 600; color: #1e293b; }

td select, td input[type=date], td input[type=text] {
  width: 100%; padding: 3px 6px;
  border: 1px solid #e2e8f0; border-radius: 4px;
  font-size: 12px; background: white; color: #1e293b;
}
td select:focus, td input:focus { outline: 2px solid #3b82f6; border-color: transparent; }

/* Status select colours */
td select.st-Paid    { background: #dcfce7; color: #15803d; }
td select.st-Unpaid  { background: #fee2e2; color: #b91c1c; }
td select.st-Pending { background: #fef9c3; color: #854d0e; }
td select.st-NS      { background: #f1f5f9; color: #475569; }

/* Row save button */
.rbtn {
  padding: 3px 10px; font-size: 11px; font-weight: 500;
  border: none; border-radius: 4px; cursor: default;
  background: #e2e8f0; color: #94a3b8; white-space: nowrap;
}
.rbtn.on  { background: #3b82f6; color: white; cursor: pointer; }
.rbtn.on:hover { background: #2563eb; }
.rmsg { font-size: 11px; margin-top: 2px; white-space: nowrap; }
.rmsg.ok  { color: #16a34a; }
.rmsg.err { color: #dc2626; }

/* PAGINATION */
#pg {
  display: flex; align-items: center; justify-content: center;
  gap: 5px; padding: 14px; font-size: 12px; color: #64748b;
}
.pgb {
  padding: 4px 10px; border: 1px solid #e2e8f0; border-radius: 4px;
  background: white; font-size: 12px; cursor: pointer; color: #475569;
}
.pgb:hover:not(:disabled) { background: #f1f5f9; }
.pgb.cur  { background: #1e2a3a; color: white; border-color: #1e2a3a; }
.pgb:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<script>
  // Redirect mobile users to mobile.html (unless they explicitly requested desktop)
  if (!/desktop=1/.test(location.search) && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    location.replace('mobile.html');
  }
</script>

<div id="hdr">
  <h1>SURVIVAL MODE</h1>
  <div class="tb">
    <input id="q" type="search" placeholder="Cari akun / sales / SPV…" oninput="applyFilter()">
    <select id="fSpv" onchange="applyFilter()"><option value="">Semua SPV</option></select>
    <select id="fM2" onchange="applyFilter()">
      <option value="">M2: Semua</option>
      <option value="Paid">M2: Paid</option>
      <option value="Unpaid">M2: Unpaid</option>
      <option value="Pending">M2: Pending</option>
      <option value="NS">M2: NS</option>
      <option value="__empty__">M2: Belum diisi</option>
    </select>
    <select id="fM3" onchange="applyFilter()">
      <option value="">M3: Semua</option>
      <option value="Paid">M3: Paid</option>
      <option value="Unpaid">M3: Unpaid</option>
      <option value="Pending">M3: Pending</option>
      <option value="NS">M3: NS</option>
      <option value="__empty__">M3: Belum diisi</option>
    </select>
    <button class="btn btn-slate" onclick="resetFilter()">Reset</button>
    <span id="inf">Memuat…</span>
    <button class="btn btn-blue" onclick="loadData()">&#8635; Reload</button>
    <a href="mobile.html" class="btn btn-slate" style="text-decoration:none">📱 Mobile</a>
  </div>
</div>

<div id="dbar">
  <strong id="dcnt"></strong> baris belum disimpan.
  <button class="btn btn-green" onclick="saveAll()">Simpan Semua</button>
  <button class="btn btn-slate" onclick="discardAll()">Batalkan</button>
</div>

<div class="tw">
  <table>
    <thead>
      <tr>
        <th style="min-width:110px">Customer Account</th>
        <th style="min-width:90px">SA Date</th>
        <th style="min-width:52px;text-align:center">Cycle</th>
        <th style="min-width:160px">Sales Name</th>
        <th style="min-width:160px">SPV Name</th>
        <th style="min-width:115px">M2</th>
        <th style="min-width:130px">M2 Payment Date</th>
        <th style="min-width:115px">M3</th>
        <th style="min-width:130px">M3 Payment Date</th>
        <th style="min-width:150px">Notes</th>
        <th style="min-width:90px;text-align:center">Aksi</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="11" style="text-align:center;padding:40px;color:#94a3b8">Memuat data…</td></tr>
    </tbody>
  </table>
</div>
<div id="pg"></div>

<script>
const API_URL   = 'https://script.google.com/macros/s/AKfycbxDLqMDTSNO4YkHPOPgUeRg466EtmYiMrMVPLkCNxdDzP1SFFl-fm_4ul1q8wZQBylm/exec';
const PAGE_SIZE = 50;
const ST_OPTS   = ['', 'Paid', 'Unpaid', 'Pending', 'NS'];

let allData      = [];
let filteredData = [];
let dirtyRows    = new Map();   // customerAccount → edited data object
let page         = 1;

// ===== LOAD =====
async function loadData() {
  setInf('Memuat…');
  setBody('<tr><td colspan="11" style="text-align:center;padding:40px;color:#94a3b8">Memuat data…</td></tr>');
  try {
    const res  = await fetch(API_URL + '?action=getData', { redirect: 'follow' });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    allData = json.data || [];
    dirtyRows.clear();
    refreshDbar();
    buildSpvSelect();
    applyFilter();
  } catch (e) {
    setInf('Error!');
    setBody(`<tr><td colspan="11" style="text-align:center;padding:40px;color:#dc2626">⚠ ${esc(e.message)}</td></tr>`);
  }
}

// ===== FILTER =====
function buildSpvSelect() {
  const cur  = document.getElementById('fSpv').value;
  const spvs = [...new Set(allData.map(r => r.spvName).filter(Boolean))].sort();
  document.getElementById('fSpv').innerHTML =
    '<option value="">Semua SPV</option>' +
    spvs.map(s => `<option value="${esc(s)}"${s===cur?' selected':''}>${esc(s)}</option>`).join('');
}

function applyFilter() {
  const q    = document.getElementById('q').value.trim().toLowerCase();
  const fSpv = document.getElementById('fSpv').value;
  const fM2  = document.getElementById('fM2').value;
  const fM3  = document.getElementById('fM3').value;

  filteredData = allData.filter(r => {
    if (q && ![r.customerAccount, r.salesName, r.spvName]
              .some(v => v.toLowerCase().includes(q))) return false;
    if (fSpv && r.spvName !== fSpv) return false;
    if (fM2 === '__empty__') { if (r.m2) return false; }
    else if (fM2 && r.m2 !== fM2) return false;
    if (fM3 === '__empty__') { if (r.m3) return false; }
    else if (fM3 && r.m3 !== fM3) return false;
    return true;
  });

  page = 1;
  renderPage();
  const n = filteredData.length, t = allData.length;
  setInf(n === t ? `${t} baris` : `${n} dari ${t} baris`);
}

function resetFilter() {
  ['q','fSpv','fM2','fM3'].forEach(id => document.getElementById(id).value = '');
  applyFilter();
}

// ===== RENDER =====
function renderPage() {
  const rows = filteredData.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  if (!rows.length) {
    setBody('<tr><td colspan="11" style="text-align:center;padding:40px;color:#94a3b8">Tidak ada data</td></tr>');
  } else {
    setBody(rows.map(renderRow).join(''));
  }
  renderPg();
}

function stCls(v) {
  return v ? 'st-' + v : '';
}

function mkSel(acc, field, val) {
  return `<select class="${stCls(val)}" onchange="onChange(this,'${acc}','${field}')">` +
    ST_OPTS.map(o => `<option value="${esc(o)}"${val===o?' selected':''}>${o||'—'}</option>`).join('') +
    '</select>';
}

function renderRow(r) {
  const acc  = r.customerAccount;
  const d    = dirtyRows.has(acc) ? { ...r, ...dirtyRows.get(acc) } : r;
  const dirt = dirtyRows.has(acc);
  return `
<tr id="row-${acc}" class="${dirt?'dirty':''}">
  <td class="tacc">${esc(acc)}</td>
  <td class="tro">${fmtSa(r.saDate)}</td>
  <td class="tro" style="text-align:center">${esc(r.cycleDate)}</td>
  <td class="tro">${esc(r.salesName)}</td>
  <td class="tro tspv">${esc(r.spvName)}</td>
  <td>${mkSel(acc,'m2',d.m2)}</td>
  <td><input type="date" value="${esc(d.m2PaymentDate||'')}" onchange="onChange(this,'${acc}','m2PaymentDate')"></td>
  <td>${mkSel(acc,'m3',d.m3)}</td>
  <td><input type="date" value="${esc(d.m3PaymentDate||'')}" onchange="onChange(this,'${acc}','m3PaymentDate')"></td>
  <td><input type="text" value="${esc(d.notes||'')}" placeholder="—" onchange="onChange(this,'${acc}','notes')"></td>
  <td style="text-align:center">
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
      <button id="sb-${acc}" class="rbtn${dirt?' on':''}"
        onclick="saveRow('${acc}')" ${dirt?'':'disabled'}>Simpan</button>
      <span id="sm-${acc}" class="rmsg"></span>
    </div>
  </td>
</tr>`;
}

function fmtSa(v) {
  const s = String(v||'').replace(/\D/g,'');
  return s.length===8 ? `${s.slice(6)}/${s.slice(4,6)}/${s.slice(0,4)}` : (v||'');
}

// ===== DIRTY TRACKING =====
function onChange(el, acc, field) {
  if (!dirtyRows.has(acc)) {
    const orig = allData.find(r => r.customerAccount === acc);
    if (orig) dirtyRows.set(acc, { ...orig });
  }
  if (dirtyRows.has(acc)) dirtyRows.get(acc)[field] = el.value;

  if (el.tagName === 'SELECT') el.className = stCls(el.value);

  const tr = document.getElementById('row-' + acc);
  const sb = document.getElementById('sb-'  + acc);
  if (tr) tr.className = 'dirty';
  if (sb) { sb.className = 'rbtn on'; sb.disabled = false; }
  refreshDbar();
}

function refreshDbar() {
  const n   = dirtyRows.size;
  const bar = document.getElementById('dbar');
  document.getElementById('dcnt').textContent = n;
  n > 0 ? bar.classList.add('show') : bar.classList.remove('show');
}

// ===== SAVE =====
async function saveRow(acc) {
  const data = dirtyRows.has(acc)
    ? dirtyRows.get(acc)
    : allData.find(r => r.customerAccount === acc);
  if (!data) return;

  const tr = document.getElementById('row-' + acc);
  const sb = document.getElementById('sb-'  + acc);
  const sm = document.getElementById('sm-'  + acc);

  if (tr) tr.className = 'saving';
  if (sb) { sb.textContent = '…'; sb.className = 'rbtn'; sb.disabled = true; }
  if (sm) { sm.textContent = ''; sm.className = 'rmsg'; }

  try {
    const url = `${API_URL}?action=updateRow&data=${encodeURIComponent(JSON.stringify(data))}`;
    const res  = await fetch(url, { redirect: 'follow' });
    const json = await res.json();
    if (json.error) throw new Error(json.error);

    const idx = allData.findIndex(r => r.customerAccount === acc);
    if (idx !== -1) Object.assign(allData[idx], data);
    dirtyRows.delete(acc);

    if (tr) { tr.className = 'saved'; setTimeout(() => { if (tr.className==='saved') tr.className=''; }, 2500); }
    if (sb) { sb.textContent = 'Simpan'; sb.className = 'rbtn'; sb.disabled = true; }
    if (sm) {
      sm.className = 'rmsg ok'; sm.textContent = '✓ Tersimpan';
      setTimeout(() => { sm.textContent = ''; }, 3000);
    }
    refreshDbar();
  } catch (e) {
    if (tr) tr.className = 'dirty errrow';
    if (sb) { sb.textContent = 'Simpan'; sb.className = 'rbtn on'; sb.disabled = false; }
    if (sm) { sm.className = 'rmsg err'; sm.textContent = '✗ ' + e.message; }
  }
}

async function saveAll() {
  for (const acc of [...dirtyRows.keys()]) await saveRow(acc);
}

function discardAll() {
  if (!confirm('Batalkan semua perubahan yang belum disimpan?')) return;
  dirtyRows.clear();
  refreshDbar();
  renderPage();
}

// ===== PAGINATION =====
function renderPg() {
  const el    = document.getElementById('pg');
  const total = filteredData.length;
  const pages = Math.ceil(total / PAGE_SIZE);
  if (pages <= 1) { el.innerHTML = ''; return; }

  const btn = (p, lbl, cls='', dis=false) =>
    `<button class="pgb ${cls}" onclick="goPage(${p})" ${dis?'disabled':''}>${lbl}</button>`;

  let html = btn(page-1, '‹', '', page<=1);

  let prev = 0;
  for (let p = 1; p <= pages; p++) {
    if (p===1 || p===pages || (p>=page-2 && p<=page+2)) {
      if (prev && p-prev>1) html += '<span style="padding:0 4px;color:#94a3b8">…</span>';
      html += btn(p, p, p===page?'cur':'');
      prev = p;
    }
  }

  html += btn(page+1, '›', '', page>=pages);
  html += `<span style="margin-left:6px;color:#64748b;font-size:11px">Hal ${page}/${pages} · ${total} baris</span>`;
  el.innerHTML = html;
}

function goPage(p) {
  const pages = Math.ceil(filteredData.length / PAGE_SIZE);
  if (p < 1 || p > pages) return;
  page = p;
  renderPage();
  document.querySelector('.tw').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ===== UTILS =====
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setInf(t) { document.getElementById('inf').textContent = t; }
function setBody(h) { document.getElementById('tbody').innerHTML = h; }

// ===== INIT =====
loadData();
</script>
</body>
</html>
